<app-topbar [projectName]="(manifest$ | async)?.name ?? 'Novo Projeto'" (openProject)="openWorkspace()"
    (randomize)="randomize()" (exportPng)="exportPng()" (help)="goToImport()">
</app-topbar>

<ng-container *ngIf="manifest$ | async as manifest">
    <div class="cb-editor">
        <!-- Coluna esquerda: prévia + camadas -->
        <div class="cb-editor__left">
            <app-preview-canvas [manifest]="manifest"></app-preview-canvas>
            <app-layers-panel [manifest]="manifest" (reorder)="reorderLayers($event)"
                (toggleVisibility)="toggleVisibility($event)">
            </app-layers-panel>
        </div>

        <!-- Coluna direita: personalização -->
        <div class="cb-editor__right">
            <p class="cb-section-title cb-editor__section-label">Personalizar</p>

            <div class="cb-editor__panel-wrap">
                <!-- Nav vertical de categorias -->
                <nav class="cb-panel-nav">
                    <button *ngFor="let cat of categories" class="cb-panel-nav__btn" type="button"
                        [class.is-active]="panelCategory === cat" (click)="setPanelCategory(cat)">
                        {{ labels[cat] }}
                    </button>
                </nav>

                <!-- Categoria ativa -->
                <div class="cb-editor__panel">
                    <app-category-browser [title]="labels[panelCategory]" [items]="manifest.assets[panelCategory]"
                        [selectedId]="manifest.selected[panelCategory]"
                        [locked]="manifest.locked[panelCategory] ?? false" (select)="onSelect(panelCategory, $event)"
                        (prev)="onPrev(panelCategory, manifest.assets[panelCategory], manifest.selected[panelCategory])"
                        (next)="onNext(panelCategory, manifest.assets[panelCategory], manifest.selected[panelCategory])"
                        (openGallery)="openGallery(panelCategory)" (toggleLock)="toggleLock(panelCategory)"
                        (importFile)="onImportFile(panelCategory, $event)"
                        (deleteAsset)="onDeleteAsset(panelCategory, $event)"
                        (editAsset)="onEditAsset(panelCategory, $event)">
                    </app-category-browser>

                    <app-actions-bar (randomize)="randomize()" (copy)="copyPng()" (exportPng)="exportPng()">
                    </app-actions-bar>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="cb-editor-footer">
        <div class="cb-editor-footer__path">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="cb-muted">Pasta atual:</span>
            <strong class="cb-editor-footer__folder">{{ workspaceName$ | async }}</strong>
            <button class="cb-editor-footer__change" type="button" (click)="openWorkspace()">Alterar</button>
        </div>
        <span class="cb-muted">Total de assets carregados:
            <strong>{{ totalAssets$ | async }} itens</strong>
        </span>
    </footer>

    <app-asset-gallery-modal [open]="showGallery" [title]="labels[activeCategory]"
        [items]="manifest.assets[activeCategory] || []" [selectedId]="manifest.selected[activeCategory]"
        [allowAdd]="false" (close)="closeGallery()" (select)="onSelect(activeCategory, $event)"
        (remove)="removeAsset(activeCategory, $event)" (editAsset)="onEditAsset(activeCategory, $event)">
    </app-asset-gallery-modal>

</ng-container>
