<div class="cb-category">
    <!-- Linha 1: Título + lápis + lixeira -->
    <div class="cb-category__header">
        <span class="cb-category__title">Template: {{ activeTemplate?.name }}</span>
        <div class="cb-category__header-btns">
            <button class="cb-icon-btn" type="button" title="Renomear template" [disabled]="!templates.length"
                (click)="startRename()">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <button class="cb-icon-btn cb-icon-btn--danger" type="button" title="Apagar template"
                [disabled]="templates.length <= 1" (click)="deleteTemplate.emit(activeTemplateId)">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6M14 11v6"></path>
                    <path d="M9 6V4h6v2"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Linha 2: Navegação -->
    <div class="cb-category__nav">
        <button class="cb-nav-btn" type="button" (click)="prev()" [disabled]="!templates.length || selectedIndex === 0">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <ng-container *ngIf="!isRenamingActive; else renameInput">
            <span class="cb-category__counter">
                {{ templates.length ? (selectedIndex + 1) : 0 }} / {{ templates.length }}
            </span>
        </ng-container>
        <ng-template #renameInput>
            <input class="cb-template-rename-input" type="text" [(ngModel)]="editingName" (blur)="commitRename()"
                (keyup.enter)="commitRename()" (keyup.escape)="cancelRename()" autofocus />
        </ng-template>

        <button class="cb-nav-btn" type="button" (click)="next()"
            [disabled]="!templates.length || selectedIndex === templates.length - 1">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <!-- Linha 3: Miniaturas (janela de 4) -->
    <div class="cb-category__thumbs">
        <div class="cb-thumb" *ngFor="let tpl of visibleTemplates" [class.is-active]="tpl.id === activeTemplateId">
            <button class="cb-thumb__select-btn" type="button" (click)="selectTemplate.emit(tpl.id)">
                <img *ngIf="tpl.previewUrl" [src]="tpl.previewUrl" [alt]="tpl.name" />
                <svg *ngIf="!tpl.previewUrl" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" style="opacity:0.35">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <div class="cb-thumb__actions">
                <label class="cb-thumb__action cb-thumb__edit" title="Alterar imagem do template">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <input type="file" accept="image/png,image/jpeg,image/webp" class="cb-sr-only"
                        (change)="onImageChange(tpl.id, $event)" (click)="$event.stopPropagation()" />
                </label>
            </div>
        </div>
        <div class="cb-thumb cb-thumb--empty" *ngFor="let _ of emptySlots"></div>
    </div>

    <!-- Linha 4: Novo -->
    <div class="cb-category__actions">
        <label class="cb-category__import">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Novo
            <input type="file" accept="image/png,image/jpeg,image/webp" class="cb-sr-only"
                (change)="onNewFileChange($event)" />
        </label>
    </div>
</div>
