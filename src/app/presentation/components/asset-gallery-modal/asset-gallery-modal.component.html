<div class="cb-modal" *ngIf="open">
    <div class="cb-modal__backdrop" (click)="close.emit()"></div>
    <div class="cb-modal__content cb-card">
        <div class="cb-modal__header">
            <div>
                <div class="cb-section-title">Galeria</div>
                <h3>{{ title }}</h3>
            </div>
            <button class="cb-btn-secondary" type="button" (click)="close.emit()">Fechar</button>
        </div>
        <div class="cb-gallery">
            <div class="cb-thumb" *ngFor="let item of items" [class.is-active]="item.id === selectedId">
                <button class="cb-thumb__select-btn" type="button" (click)="select.emit(item.id)">
                    <img [src]="item.previewUrl" [alt]="item.name" />
                </button>
                <div class="cb-thumb__actions">
                    <button class="cb-thumb__action cb-thumb__delete" type="button" (click)="confirmDelete(item.id)"
                        title="Excluir elemento">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14H6L5 6"></path>
                            <path d="M10 11v6M14 11v6"></path>
                            <path d="M9 6V4h6v2"></path>
                        </svg>
                    </button>
                    <button class="cb-thumb__action cb-thumb__edit" type="button" (click)="editAsset.emit(item.id)"
                        title="Editar elemento">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
