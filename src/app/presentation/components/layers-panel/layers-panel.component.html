<div class="cb-card cb-layers">
    <div class="cb-layers__header">
        <span class="cb-section-title">Camadas</span>
        <span class="cb-muted cb-layers__hint">arraste para reordenar</span>
    </div>
    <div class="cb-layers__list" *ngIf="manifest">
        <div class="cb-layers__item" *ngFor="let category of displayOrder" draggable="true"
            [class.is-hidden]="isHidden(category)" (dragstart)="onDragStart(category)"
            (dragover)="onDragOver($event, category)" (drop)="onDrop($event)" (dragend)="onDragEnd()">

            <button class="cb-layers__eye-btn" type="button"
                [title]="isHidden(category) ? 'Mostrar camada' : 'Ocultar camada'"
                (click)="onToggleVisibility(category)">
                <!-- eye open -->
                <svg *ngIf="!isHidden(category)" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- eye closed -->
                <svg *ngIf="isHidden(category)" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>

            <span class="cb-layers__name">{{ labels[category] }}</span>

            <svg class="cb-layers__drag" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </div>
    </div>
</div>
