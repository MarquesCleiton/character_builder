<div class="cb-category">
    <!-- Linha 1: Título + botões -->
    <div class="cb-category__header">
        <span class="cb-category__title">{{ title }}</span>
        <div class="cb-category__header-btns">
            <button class="cb-icon-btn" type="button" [class.is-locked]="locked" (click)="toggleLock.emit()"
                [title]="locked ? 'Destravar' : 'Travar'">
                <svg *ngIf="locked" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <svg *ngIf="!locked" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Linha 2: Navegação -->
    <div class="cb-category__nav">
        <button class="cb-nav-btn" type="button" (click)="prev.emit()" [disabled]="!items.length">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <span class="cb-category__counter">
            {{ items.length ? (selectedIndex + 1) : 0 }} / {{ items.length }}
        </span>
        <button class="cb-nav-btn" type="button" (click)="next.emit()" [disabled]="!items.length">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <!-- Linha 3: Miniaturas (janela de 4) -->
    <div class="cb-category__thumbs">
        <div class="cb-thumb" *ngFor="let item of visibleItems" [class.is-active]="item.id === selectedId">
            <button class="cb-thumb__select-btn" type="button" (click)="select.emit(item.id)">
                <img [src]="item.previewUrl" [alt]="item.name" />
            </button>
            <div class="cb-thumb__actions">
                <button class="cb-thumb__action cb-thumb__delete" type="button" (click)="deleteAsset.emit(item.id)"
                    title="Excluir elemento">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14H6L5 6"></path>
                        <path d="M10 11v6M14 11v6"></path>
                        <path d="M9 6V4h6v2"></path>
                    </svg>
                </button>
                <button class="cb-thumb__action cb-thumb__edit" type="button" (click)="editAsset.emit(item.id)"
                    title="Editar elemento">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="cb-thumb cb-thumb--empty" *ngFor="let _ of emptySlots"></div>
    </div>

    <!-- Linha 4: Ver todos + Importar -->
    <div class="cb-category__actions">
        <button class="cb-category__view-all" type="button" (click)="openGallery.emit()">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
            Ver todos
        </button>
        <label class="cb-category__import" title="Importar novo elemento">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Importar
            <input type="file" accept="image/png,image/jpeg,image/webp" (change)="onFileChange($event)" hidden />
        </label>
    </div>
</div>
